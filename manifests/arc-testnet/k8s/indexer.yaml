# Arc testnet native USDC — live Transfer stream (third-party traffic).
# No abi (auto-fetched from the explorer) and no startBlock (tails from head).
# To watch a visible backfill instead, add e.g. `startBlock: <head-2000>`.
apiVersion: arckive.org/v1alpha1
kind: Indexer
metadata:
  name: usdc-arc
spec:
  network:
    chainId: 5042002
    rpc: ["wss://arc-testnet.drpc.org", "https://arc-testnet.drpc.org"]
    announceRpc: ["wss://rpc.testnet.arc.network"]
    finalityTag: latest
  storage:
    mode: External
    external:
      dsnSecretRef: { name: pg-dsn, key: url }
  contracts:
    # native USDC is a FiatToken proxy — explorer serves only the proxy ABI, so
    # the ERC-20 Transfer is inline (no ConfigMap). Non-proxy contracts can omit
    # abi entirely and have it auto-fetched from the explorer (see flowswap).
    - name: usdc
      address: "0x3600000000000000000000000000000000000000"
      startBlock: -500   # last ~500 blocks: instant data, then live
      events: [Transfer]
      abi:
        inline:
          - type: event
            name: Transfer
            inputs:
              - { name: from, type: address, indexed: true }
              - { name: to, type: address, indexed: true }
              - { name: value, type: uint256, indexed: false }
  polling:
    batchBlocks: 1000
    intervalMs: 2000
