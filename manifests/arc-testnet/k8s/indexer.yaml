# Arc testnet native USDC — live Transfer stream (third-party traffic).
# Set startBlock near the current head: check eth_blockNumber and start
# ~2000 blocks back to make the backfill visible.
apiVersion: arclight.dev/v1alpha1
kind: Indexer
metadata:
  name: usdc-arc
spec:
  network:
    chainId: 5042002
    rpc: ["wss://arc-testnet.drpc.org", "https://arc-testnet.drpc.org"]
    # the official endpoint announces fastest but rate-limits queries — listen only
    announceRpc: ["wss://rpc.testnet.arc.network"]
    finalityTag: latest
  storage:
    mode: External
    external:
      dsnSecretRef: { name: pg-dsn, key: url }
  contracts:
    - name: usdc
      address: "0x3600000000000000000000000000000000000000"
      abi:
        configMapRef: { name: usdc-abi, key: abi.json }
      startBlock: 52983000
      events: [Transfer]
  polling:
    batchBlocks: 1000
    intervalMs: 2000
