name: release
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Operatör imajı
        uses: docker/build-push-action@v6
        with:
          context: .
          target: operator
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/goguzgungor/arclight-operator:latest
            ghcr.io/goguzgungor/arclight-operator:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Worker imajı
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/goguzgungor/arclight-worker:latest
            ghcr.io/goguzgungor/arclight-worker:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: install.yaml üret ve rolling "latest" release'ine yükle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/build-install.sh
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "latest" \
              --notes "Rolling release: main'in son hali. Kurulum: kubectl apply -f https://arckive.org/install.yaml"
          gh release upload latest install.yaml --clobber
      - name: install.yaml'ı site-landing'e senkronla (arckive.org yayını)
        run: |
          cp install.yaml "$RUNNER_TEMP/install.yaml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin site-landing
          git checkout site-landing
          mkdir -p site/public
          cp "$RUNNER_TEMP/install.yaml" site/public/install.yaml
          if ! git diff --quiet -- site/public/install.yaml || [ -n "$(git status --porcelain site/public/install.yaml)" ]; then
            git add site/public/install.yaml
            git commit -m "site: install.yaml güncellendi (main ${GITHUB_SHA:0:7})"
            git push origin site-landing
          else
            echo "install.yaml değişmedi, site push atlanıyor"
          fi
