name: release
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Operator image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: operator
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/goguzgungor/arckive-operator:latest
            ghcr.io/goguzgungor/arckive-operator:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/goguzgungor/arckive-worker:latest
            ghcr.io/goguzgungor/arckive-worker:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: build install.yaml and upload to the rolling "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/build-install.sh
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "latest" \
              --notes "Rolling release: latest main. Install: kubectl apply -f https://arckive.org/install.yaml"
          gh release upload latest install.yaml --clobber
      - name: sync install.yaml + demo.yaml to site-landing (served at arckive.org)
        run: |
          cp install.yaml "$RUNNER_TEMP/install.yaml"
          cp manifests/arc-testnet/k8s/demo.yaml "$RUNNER_TEMP/demo.yaml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin site-landing
          git checkout site-landing
          mkdir -p site/public
          cp "$RUNNER_TEMP/install.yaml" site/public/install.yaml
          cp "$RUNNER_TEMP/demo.yaml" site/public/demo.yaml
          if [ -n "$(git status --porcelain site/public/install.yaml site/public/demo.yaml)" ]; then
            git add site/public/install.yaml site/public/demo.yaml
            git commit -m "site: update install.yaml + demo.yaml (main ${GITHUB_SHA:0:7})"
            git push origin site-landing
          else
            echo "install.yaml + demo.yaml unchanged, skipping site push"
          fi
