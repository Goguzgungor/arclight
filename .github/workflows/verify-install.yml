name: verify-install
on: workflow_dispatch

jobs:
  kind-install:
    runs-on: ubuntu-latest
    steps:
      - uses: helm/kind-action@v1
        with:
          cluster_name: install-verify
      - name: apply arckive.org/install.yaml
        run: kubectl apply -f https://arckive.org/install.yaml
      - name: operator becomes Ready
        run: kubectl -n arclight-system rollout status deploy/arclight-operator --timeout=180s
      - name: CRD is served
        run: kubectl get indexers -A
