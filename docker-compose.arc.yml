services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: arckive
      POSTGRES_PASSWORD: arckive
      POSTGRES_DB: arckive
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arckive"]
      interval: 2s
      timeout: 2s
      retries: 15

  worker:
    build:
      context: .
      target: worker
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://arckive:arckive@postgres:5432/arckive
      CONFIG_PATH: /etc/arckive/worker-config.json
    volumes:
      - ./manifests/arc-testnet:/etc/arckive:ro
    ports: ["9090:9090"]
