apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: indexers.arclight.dev
spec:
  group: arclight.dev
  names:
    kind: Indexer
    listKind: IndexerList
    plural: indexers
    singular: indexer
    shortNames: [idx]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Current
          type: integer
          jsonPath: .status.currentBlock
        - name: Head
          type: integer
          jsonPath: .status.headBlock
        - name: Lag
          type: integer
          jsonPath: .status.lag
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [network, storage, contracts]
              properties:
                network:
                  type: object
                  required: [chainId, rpc]
                  properties:
                    chainId:
                      type: integer
                      minimum: 1
                    rpc:
                      type: array
                      minItems: 1
                      items:
                        type: string
                        pattern: '^(https?|wss?)://'
                        description: "http(s):// for polling/reads; ws(s):// for newHeads subscription + reads"
                    announceRpc:
                      type: array
                      items:
                        type: string
                        pattern: '^wss?://'
                        description: "ws endpoints used only to listen for newHeads — never added to the query pool"
                    finalityTag:
                      type: string
                      enum: [finalized, safe, latest]
                      default: finalized
                storage:
                  type: object
                  required: [mode, external]
                  properties:
                    mode:
                      type: string
                      enum: [External]
                    external:
                      type: object
                      required: [dsnSecretRef]
                      properties:
                        dsnSecretRef:
                          type: object
                          required: [name]
                          properties:
                            name:
                              type: string
                            key:
                              type: string
                              default: url
                contracts:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [name, address, abi]
                    properties:
                      name:
                        type: string
                        pattern: "^[a-z][a-z0-9-]{0,29}$"
                      address:
                        type: string
                        pattern: "^0x[0-9a-fA-F]{40}$"
                      abi:
                        type: object
                        required: [configMapRef]
                        properties:
                          configMapRef:
                            type: object
                            required: [name]
                            properties:
                              name:
                                type: string
                              key:
                                type: string
                                default: abi.json
                      startBlock:
                        type: integer
                        minimum: 0
                        default: 0
                      events:
                        type: array
                        items:
                          type: string
                polling:
                  type: object
                  properties:
                    batchBlocks:
                      type: integer
                      minimum: 1
                      default: 1000
                    intervalMs:
                      type: integer
                      minimum: 1
                      default: 2000
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Provisioning, Backfilling, Live, Degraded]
                currentBlock:
                  type: integer
                headBlock:
                  type: integer
                lag:
                  type: integer
                lastError:
                  type: string
                observedGeneration:
                  type: integer
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status, reason, lastTransitionTime]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
