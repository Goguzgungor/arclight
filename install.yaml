# Source: arclight/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arclight-operator
  namespace: arclight-system
  labels:
    app.kubernetes.io/name: arclight-operator
    app.kubernetes.io/instance: arclight
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: arclight-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arclight-operator
        app.kubernetes.io/instance: arclight
        app.kubernetes.io/managed-by: Helm
    spec:
      serviceAccountName: arclight-operator
      containers:
        - name: operator
          image: "ghcr.io/goguzgungor/arclight-operator:latest"
          imagePullPolicy: Always
          env:
            - name: WORKER_IMAGE
              value: "ghcr.io/goguzgungor/arclight-worker:latest"
            - name: LOG_LEVEL
              value: "info"
            - name: RESYNC_INTERVAL_MS
              value: "300000"
          ports:
            - containerPort: 8080
              name: health
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
